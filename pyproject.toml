[project]
name = "wince"
version = "0.1.0"
description = "Semantic risk router for code changes: how carefully to review, who should, where to look first"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["typesafe-sdk>=0.6", "pyyaml>=6"]

[project.scripts]
wince = "wince.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wince"]
