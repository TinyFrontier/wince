[project]
name = "wince"
version = "0.1.0"
description = "Routes human review attention: green/yellow/red for a diff, who should look. It doesn't review the code."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["typesafe-sdk>=0.6", "pyyaml>=6"]

[project.scripts]
wince = "wince.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wince"]
